<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prio · your day, in colour</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="brand-corner"><span class="logo-dot"></span>Prio</div>

  <main class="auth-wrap">
    <div class="auth-card fade-up" id="authCard">
      <h1 class="auth-title" id="authTitle" style="margin-top:0">Welcome back</h1>
      <p class="auth-sub" id="authSub">Log in to pick up where you left off.</p>

      <button type="button" class="btn-google" id="googleAuthBtn">
        <svg class="g-logo" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.6 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.3 13.2 17.7 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.6-.15-3.15-.4-4.65H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.6 5.9C44.2 37.9 46.98 31.7 46.98 24.55z"/>
          <path fill="#FBBC05" d="M10.4 28.7c-.5-1.5-.8-3.05-.8-4.7s.3-3.2.8-4.7l-7.8-6.1C1 16.5 0 20.1 0 24s1 7.5 2.6 10.8l7.8-6.1z"/>
          <path fill="#34A853" d="M24 48c6.5 0 11.95-2.15 15.93-5.85l-7.6-5.9c-2.1 1.45-4.8 2.3-8.33 2.3-6.3 0-11.7-3.7-13.6-9.8l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/>
        </svg>
        <span id="googleAuthLabel">Continue with Google</span>
      </button>

      <div class="auth-divider"><span>or</span></div>

      <div class="tab-switch" id="tabSwitch">
        <div class="tab-thumb"></div>
        <button type="button" id="tabLogin" class="active">Log in</button>
        <button type="button" id="tabSignup">Sign up</button>
      </div>

      <div class="field" id="nameField" style="display:none">
        <label for="displayName">Your name</label>
        <div class="input-shell">
          <input type="text" id="displayName" placeholder="e.g. Alex" autocomplete="name" />
        </div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <div class="input-shell">
          <input type="email" id="email" placeholder="you@email.com" autocomplete="email" />
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-shell">
          <input type="password" id="password" placeholder="At least 6 characters" autocomplete="current-password" />
          <button type="button" class="eye-btn" id="togglePw">SHOW</button>
        </div>
      </div>

      <button type="button" class="btn-primary" id="submitBtn">Log in</button>
      <div class="auth-msg" id="authMsg"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
</body>
</html>
